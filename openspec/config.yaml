schema: glitchflow

context: |
  このプロジェクトでは VS Code 拡張機能の GlitchFlow を開発する。

  文書の役割:
  - config.yaml: 共通ルールと、適用やアーカイブ時の運用を定義する。
  - product.md: 目的、スコープ、中核機能、ユースケース、ドメインを定義する。
  - tech.md: アーキテクチャ、主要ライブラリ、開発基準、テスト方針、記述例を定義する。
  - structure.md: ディレクトリ構造、命名規則、配置原則を定義する。
  - traceability.md: 台帳の状態と記録形式、要件と成果物の対応、変更履歴、検証結果を管理する。
  - schemas/glitchflow/schema.yaml: 成果物の依存関係と、成果物ごとの作成手順を定義する。
  - schemas/glitchflow/templates/: 見出し、表、入力欄の形式を定義する。

  参照と保存:
  - 上記の文書一覧はopenspec/からの相対パスであり、各作業の開始前にconfig.yaml、product.md、tech.md、structure.md、traceability.mdの最新の本文を必ず読む。
  - 成果物の作成では、対象変更に記録されたスキーマの指示とテンプレートも読む。
  - 方針文書は長期的な判断の根拠、仕様は要件の定義、設計は実現方法、タスクは作業と完了条件、台帳は対応関係と実績を正とする。
  - 正式仕様と差分仕様の同じIDは同じ要件の版として扱い、対象変更では差分を適用した結果を検討する。
  - 参照先の不足や内容の矛盾を推測で補わず、影響する作業の前に確認する。
  - 保存前に、参照した方針と成果物の整合性、表記、リンク、IDの対応を確認する。
  - 共通ルールの変更はこのファイル、成果物固有の手順の変更はスキーマへ反映し、テンプレートに同じ説明を複製しない。
  - 既存変更に記録されたスキーマを無断で切り替えない。

  表記:
  - README、方針文書、OpenSpecの成果物を含むすべてのプロジェクト文書は、読みやすくシンプルな日本語で書く。
  - 文体は常体(だ、である調)に統一し、敬体を使わない。
  - 句点の後は必ず改行し、1行に複数の文を書かない。
  - 句読点を除き、括弧や引用符などの記号は半角を使う。
  - コード、識別子、URL、OpenSpecに必要な見出しと英語のキーワードは正しい構文を保つ。
  - 表には短い語句とリンクを置き、説明文は表の外に記載する。
  - 入力欄は {{...}} で示し、完成した成果物には未置換の欄と案内コメントを残さない。
  - 対象外の欄には理由、未決事項がない欄には"なし"を記載する。

  要件IDとトレーサビリティ:
  - 機能要件はREQ-001、非機能要件はNREQ-001の形式とし、1つのIDには独立して検証できる1つの要件を割り当てる。
  - 番号は3桁以上のゼロ埋めとし、種別ごとに台帳、正式仕様、進行中の変更、アーカイブを確認して最大番号の次を採番し、未採番なら001から始める。
  - 新規IDは提案時にtraceability.mdへ予約し、却下や廃止の後も保持して再利用せず、過去の欠番を埋めない。
  - 既存要件の変更ではIDを維持し、分割や統合では旧IDと新IDの関係と理由を台帳に残す。
  - シナリオIDはREQ-001-S01またはNREQ-001-S01の形式で要件に従属させ、既存IDを維持して別の例に使い回さない。
  - 要件本文は正式仕様と差分仕様に置き、台帳へ重複して記載しない。
  - 提案、仕様、設計、タスク、実装、テスト、検証結果をIDとリンクで双方向に追跡する。
  - 実装は公開APIの説明や責務を持つ箇所から要件IDを参照し、受け入れテストの名前またはメタデータに要件IDとシナリオIDを含める。
  - 設計の対応表は予定、台帳の実装と検証の対応表は実績として区別する。
  - 未作成、未実装、未検証を区別し、リンクや実行結果がない項目を完了扱いにしない。
  - 方針文書やテンプレートの例を採番済み要件とみなさない。
  - 設計判断番号は文書内で一意のD-01形式とし、変更名と設計節へのリンクで識別する。

  EARSとGherkin:
  - 要件本文は日本語のEARSで条件、主体、要求する応答を定義し、Gherkinで具体的な受け入れ例を定義する。
  - EARSは常時、イベント、状態、異常、任意機能を使い分け、条件にWHEN、WHILE、IF/THEN、WHERE、要求にSHALLを使う。
  - GherkinはOpenSpecのMarkdownとして表現し、GIVENに初期状態と入力、WHENに1つの契機、THENに観測可能な結果を記載する。
  - 追加の前提や結果にはANDまたはBUTを使い、正常、境界、異常を検討して、適用しない観点には理由を記録する。
  - 曖昧な表現は具体的な条件、値、単位、表示内容、判定方法へ置き換える。
  - 非機能要件には測定条件と合格基準を明示し、性能では対象データ、実行環境、測定区間、指標、閾値を定める。

  BDDと計画の合意:
  - 利用者の目的を起点に、業務、開発、テストの観点から具体例と疑問を整理し、合意したシナリオから設計とタスクを導く。
  - 仕様、方式、タスク分解を左右する未決事項はtasks作成前に確認して解消し、数値や動作を推測で確定しない。
  - ユーザーとの合意の根拠と未決事項の解消をproposal.mdのReadinessに記録し、成果物がそろっただけで合意済みとしない。
  - 自動化する振る舞いの変更は、受け入れテストの失敗確認、実装、成功確認、リファクタリングの順で進める。
  - 自動化できない条件は手動確認の手順、結果、証跡を残す。
  - 仕様、テスト、台帳を同じ変更で更新し、観測できる振る舞いを受け入れ条件とする。

  製品の振る舞いを変えない変更:
  - 文書、開発基盤、リファクタリングだけの変更は、proposal.mdに理由を書き、変更の .openspec.yaml に skip_specs: true を設定する。
  - この場合はspecsを作成せず、製品要件を新規採番しない。
  - 提案の要件一覧と具体例は対象外とする理由を記載し、支援作業は設計節を根拠に台帳の支援変更一覧へ記録する。

operations:
  apply:
    guidance:
      - 開始時にproposal.mdのReadinessを確認し、合意と未決事項の解消を確認できた範囲の実装を進める。
      - tech.mdの検証方針に従い、実装とテストの実際のパス、テスト名、検証結果を台帳の記録形式に沿って残す。
  archive:
    guidance:
      - 完了条件と検証結果を確認し、仕様、実装、テストの不一致を解消してからアーカイブする。
      - 異なる要件へのIDの二重割り当て、未定義のID参照、必要なシナリオや検証結果の欠落がないことを確認する。
      - 台帳の仕様リンクを同期後の正式仕様へ、変更の成果物へのリンクをアーカイブ後の配置へ更新する。
